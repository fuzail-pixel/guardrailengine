services:
  postgres:
    image: postgres:15
    container_name: virality_postgres
    environment:
      POSTGRES_DB: virality_db
      POSTGRES_USER: virality_user
      POSTGRES_PASSWORD: virality_pass
      TZ: Asia/Kolkata
      PGTZ: Asia/Kolkata
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: virality_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: